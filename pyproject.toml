[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-inference-benchmarks"
version = "0.2.0"
description = "LLM benchmarks for hardware you already own — no GPU required."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9,<1.0",
    "pydantic>=2.0,<3.0",
    "psutil>=5.9,<7.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<7.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.0,<2.0",
    "types-psutil>=6.0,<7.0",
]

[project.scripts]
bench = "benchmarks.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
